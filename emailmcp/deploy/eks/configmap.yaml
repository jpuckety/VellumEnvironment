apiVersion: v1
kind: ConfigMap
metadata:
  name: emailmcp-config
  namespace: emailmcp
data:
  CONFIG_API_URL: "${CONFIG_API_URL}"
  AWS_REGION: "${AWS_REGION}"
  GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
  APPLICATION_ID: "${APPLICATION_ID}"
  EMAILMCP_LOG_LEVEL: "${EMAILMCP_LOG_LEVEL}"
  EMAILMCP_LISTEN_ADDR: ":8080"
  PUBLIC_BASE_URL: "${PUBLIC_BASE_URL}"
  # Comma-separated HTTPS redirect allowlist. Empty = not enforced.
  # Examples: "app.example.com,*.corp.example.com,https://web.example.com/oauth/cb"
  OAUTH_REDIRECT_ALLOWLIST: "${OAUTH_REDIRECT_ALLOWLIST}"

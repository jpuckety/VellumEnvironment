apiVersion: v1
kind: Secret
metadata:
  name: emailmcp-secrets
  namespace: emailmcp
type: Opaque
stringData:
  GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
  # Stable HS256 signing key for session JWTs (access 1h + refresh 7d).
  # Must be set in emailmcp/.env so envsubst can inject it at deploy time.
  EMAILMCP_JWT_SECRET: "${EMAILMCP_JWT_SECRET}"

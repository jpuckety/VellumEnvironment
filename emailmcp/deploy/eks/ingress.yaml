apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emailmcp
  namespace: emailmcp
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: ${CERTIFICATE_ARN}
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: '8080'
    alb.ingress.kubernetes.io/success-codes: '200'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    # Idle timeout bumped to 5 minutes so large/slow document uploads (up to
    # 200 MB) don't get cut by the ALB before Tomcat finishes reading the body.
    # (AWS ALB has no configurable request-body size limit for IP/instance
    # targets, so size enforcement is done at the Spring/Tomcat layer.)
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
    alb.ingress.kubernetes.io/tags: app=emailmcp

spec:
  ingressClassName: alb
  rules:
  - host: emailmcp.ecg.co
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: emailmcp
            port:
              number: 80

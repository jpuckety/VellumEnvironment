apiVersion: apps/v1
kind: Deployment
metadata:
  name: emailmcp
  namespace: emailmcp
  labels:
    app: emailmcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emailmcp
  template:
    metadata:
      labels:
        app: emailmcp
    spec:
      serviceAccountName: emailmcp
      containers:
      - name: emailmcp
        image: ${ECR_REPO_URL}:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: emailmcp-config
        - secretRef:
            name: emailmcp-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: emailmcp
  namespace: emailmcp
spec:
  type: NodePort
  selector:
    app: emailmcp
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP

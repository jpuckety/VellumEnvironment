name: PR CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: emailmcp/go.mod
          cache-dependency-path: emailmcp/go.sum
      - name: Go test
        working-directory: emailmcp
        run: go test ./...
      - name: Docker build
        run: docker build -t email-mcp:pr .
